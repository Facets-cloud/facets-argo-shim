name: release-image

# Pushing a tag like v0.11 builds and pushes
# docker.io/facetscloud/facets-argo-shim:<tag>.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
#
# All third-party actions below are pinned by full commit SHA (with the
# version as a trailing comment) rather than a mutable tag, so a compromised
# or force-moved upstream tag can't silently swap in different code on a
# tag-push (i.e. release) trigger.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: resolver/go.mod
      - name: Unit + shell tests
        run: cd resolver && go vet ./... && go test ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/facetscloud/facets-argo-shim:${{ github.ref_name }}
            docker.io/facetscloud/facets-argo-shim:latest
