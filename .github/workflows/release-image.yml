name: release-image

# Pushing a tag like v0.10 builds and pushes
# docker.io/facetscloud/facets-argo-shim:<tag>.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: resolver/go.mod
      - name: Unit + shell tests
        run: cd resolver && go vet ./... && go test ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            docker.io/facetscloud/facets-argo-shim:${{ github.ref_name }}
            docker.io/facetscloud/facets-argo-shim:latest
